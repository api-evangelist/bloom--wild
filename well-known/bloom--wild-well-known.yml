notes:
  - >-
    The security.txt is RFC 9116 shaped but INCOMPLETE — it carries Contact,
    Preferred-Languages, Canonical and Hiring but omits `Expires`, which RFC 9116
    §2.5.5 makes a REQUIRED field, and omits the optional but useful `Policy` and
    `Encryption`. Graded in conformance/bloom--wild-conformance.yml.
  - >-
    Both storefront hosts serve a single 68,718-byte Angular SPA shell for every
    path, including deliberately invalid ones, so a raw HTTP 200 from the
    storefront is not evidence a page exists. Every page assertion in this repo
    was verified with a JavaScript-rendering fetch against a nonsense-path control.
