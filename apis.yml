aid: bloom--wild
name: Bloom & Wild
description: 'Bloom & Wild is a British direct-to-consumer online florist and gifting
  brand founded in 2013 by Aron Gelbard and Ben Stanway, best known for pioneering
  letterbox flowers — bouquets packed flat so they fit through a UK letterbox — alongside
  hand-tied bouquets, plants, gift sets, gift cards and recurring flower subscriptions.
  Bloom & Wild Group trades as Bloom & Wild in the United Kingdom, Ireland, Germany
  and Austria, and operates the sister brands bloomon (Netherlands, Belgium, Denmark)
  and Bergamotte (France) on separate storefronts. The group is a certified B Corp
  and runs its own commerce platform — a Ruby on Rails backend fronted by Kong, an
  Angular multi-brand web app and native iOS and Android clients, on AWS and GCP.
  Bloom & Wild publishes NO public developer portal, no API documentation, no OpenAPI
  or other machine-readable API description, and no partner or corporate-gifting API:
  business and bulk gifting is transacted through a contact form, an account manager
  and invoicing, not through a programmatic surface. The application backends at
  api.bloomandwild.com and capi.bloomandwild.com are live but private to the brand''s
  own clients and undocumented. What the group does publish for machines is narrow
  but real: an llms.txt on the UK and German storefronts that routes assistants to
  the correct market by delivery destination and even ships an optional agent widget
  specification, and an RFC 9116 security.txt served across every group storefront.'
